name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (stacks, no backend)
        run: |
          for dir in envs/staging/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: terraform test (modules, mocked providers)
        run: |
          for dir in modules/*/; do
            echo "::group::test $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          quiet: true

      - name: shellcheck
        run: shellcheck scripts/*.sh

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: static
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Dump OIDC claims used by the trust policy
        run: |
          tok="$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          # JWT payload is base64url (no padding); translate to standard base64 and pad to a
          # multiple of 4 before decoding. Only these five claims are printed, never the token.
          payload="$(echo "$tok" | cut -d. -f2 | tr '_-' '/+')"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          while [ "$pad" -gt 0 ]; do payload="${payload}="; pad=$((pad - 1)); done
          echo "$payload" | base64 -d 2>/dev/null \
            | jq '{sub, repository, repository_owner, environment, event_name, job_workflow_ref, ref}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan bootstrap and foundation
        run: |
          for stack in bootstrap foundation; do
            ./scripts/plan-summary.sh "envs/staging/$stack" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Plan platform (only while the cluster exists)
        run: |
          if aws eks describe-cluster --name auto-shop-staging >/dev/null 2>&1; then
            ./scripts/plan-summary.sh envs/staging/platform >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### platform: skipped (cluster not running)" >> "$GITHUB_STEP_SUMMARY"
          fi
