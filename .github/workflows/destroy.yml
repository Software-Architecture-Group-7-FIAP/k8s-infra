name: Destroy
# HML/platform teardown runs only in the isolated cluster-destroy.yml CodeBuild workflow.
run-name: ${{ inputs.session_id }}-${{ inputs.stack }}-${{ inputs.scope }}-${{ inputs.operation }}:${{ inputs.lifecycle_dispatch_id || github.run_id }}

# Teardown is always a separate plan review and explicitly confirmed workflow dispatch.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: First create a plan; in a separate run, destroy that exact reviewed plan
        required: true
        type: choice
        options:
          - plan
          - destroy
      stack:
        description: Destroy HML/production roots before platform and foundation
        required: true
        type: choice
        options:
          - production
          - foundation
      scope:
        description: Use all for an environment/platform root or compute for foundation; persistent network resources are protected
        required: true
        default: compute
        type: choice
        options:
          - all
          - compute
      session_id:
        description: Coordinator-provided session ID
        required: true
        type: string
      started_at:
        description: Coordinator-provided UTC session start, YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      lifecycle_dispatch_id:
        description: Coordinator correlation ID for this workflow dispatch
        required: true
        type: string
      session_mode:
        description: Authorized lifecycle window for this teardown
        required: true
        type: choice
        options:
          - hml
          - prd-window
      plan_id:
        description: Required for operation destroy; use the ID from the reviewed plan run
        required: false
        type: string
      confirm:
        description: For operation destroy, type destroy after reviewing the plan and current cost/budget
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-infra
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "true"
  EXPECTED_AWS_ACCOUNT_ID: "035611741563"
  LIFECYCLE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
  PLAN_BUCKET: auto-shop-tfstate-035611741563-use1
  PLAN_PREFIX: k8s-infra/staging/plans
  EKS_CLUSTER_ENDPOINT_ADMIN_CIDRS: ${{ vars.EKS_CLUSTER_ENDPOINT_ADMIN_CIDRS }}
  TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_CLUSTER_ENDPOINT_ADMIN_CIDRS }}
  TF_VAR_enable_private_eks_runner: ${{ vars.ENABLE_PRIVATE_EKS_RUNNER || 'false' }}
  TF_VAR_github_runner_group_id: ${{ vars.GITHUB_RUNNER_GROUP_ID || '0' }}
  TF_VAR_github_codeconnection_arn: ${{ vars.GITHUB_CODECONNECTION_ARN || '' }}

jobs:
  destroy-plan:
    name: create destroy plan
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 13
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require persistent private-runner configuration for foundation
        env:
          REQUESTED_STACK: ${{ inputs.stack }}
        run: python3 scripts/require_private_runner_configuration.py

      - name: Reject a reused lifecycle dispatch ID
        env:
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
          REQUESTED_SESSION_STARTED_AT: ${{ inputs.started_at }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/assert_unique_lifecycle_dispatch.py --workflow-file destroy.yml

      - name: Require the matching authorized staging session
        env:
          REQUESTED_STACK: ${{ inputs.stack }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_STARTED_AT: ${{ inputs.started_at }}
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
          REQUESTED_SESSION_MODE: ${{ inputs.session_mode }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_LIFECYCLE_DISPATCH_ID" && ! "$REQUESTED_LIFECYCLE_DISPATCH_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::The lifecycle dispatch ID must be 32 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Destroy plans require main."
            exit 1
          fi
          case "$REQUESTED_STACK" in
            production)
              if [[ "$REQUESTED_SCOPE" != "all" ]]; then
                echo "::error::Environment and platform roots require scope=all."
                exit 1
              fi
              ;;
            foundation)
              if [[ "$REQUESTED_SCOPE" != "compute" ]]; then
                echo "::error::Foundation teardown must use scope=compute to preserve the VPC and SSM contract."
                exit 1
              fi
              ;;
            *) echo "::error::Unsupported Terraform stack."; exit 1 ;;
          esac
          if [[ "$REQUESTED_STACK" == "hml" && "$REQUESTED_SESSION_MODE" != "hml" ]]; then
            echo "::error::The HML root can only be torn down in an HML session."
            exit 1
          fi
          if [[ "$REQUESTED_STACK" == "production" && "$REQUESTED_SESSION_MODE" != "prd-window" ]]; then
            echo "::error::The production root can only be torn down in a PRD window."
            exit 1
          fi
          python3 scripts/validate_staging_session.py \
            --session-id "$REQUESTED_SESSION_ID" \
            --started-at "$REQUESTED_STARTED_AT" \
            --mode "$REQUESTED_SESSION_MODE" \
            --operation teardown \
            --minimum-remaining-seconds 900

      - name: Validate AWS region before requesting credentials
        env:
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_AWS_REGION" != "us-east-1" ]]; then
            echo "::error::Staging destroy plans are restricted to us-east-1; received '$REQUESTED_AWS_REGION'."
            exit 1
          fi

      - name: Require a trusted lifecycle actor before AWS credentials
        env:
          LIFECYCLE_TRUSTED_OPERATORS: ${{ vars.LIFECYCLE_TRUSTED_OPERATORS || '' }}
        run: python3 scripts/require_trusted_lifecycle_operator.py

      - name: Require the exact isolated HML deploy role before AWS credentials
        if: inputs.stack == 'hml'
        env:
          HML_DEPLOY_ROLE_ARN: ${{ vars.AWS_HML_DEPLOY_ROLE_ARN || '' }}
        run: |
          set -euo pipefail
          if [[ "$HML_DEPLOY_ROLE_ARN" != "arn:aws:iam::035611741563:role/auto-shop/gh-deploy-k8s-hml" ]]; then
            echo "::error::AWS_HML_DEPLOY_ROLE_ARN must be configured to the dedicated HML-only role."
            exit 1
          fi

      - name: Assume the dedicated lifecycle authorization consumer role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.EXPECTED_AWS_ACCOUNT_ID }}:role/auto-shop/auto-shop-staging-github-lifecycle-consumer-k8s-destroy
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          role-session-name: lifecycle-consumer-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Consume the one-use destroy-plan dispatch authorization
        env:
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
        run: |
          set -euo pipefail
          python3 scripts/consume_lifecycle_dispatch.py \
            --session-id "$REQUESTED_SESSION_ID" \
            --dispatch-id "$REQUESTED_LIFECYCLE_DISPATCH_ID" \
            --workflow "Destroy"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account and report destroy scope
        env:
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Expected AWS account $EXPECTED_AWS_ACCOUNT_ID, received $account_id."
            exit 1
          fi
          {
            echo "### AWS destroy-plan scope"
            echo "- Account: $account_id"
            echo "- Region: $REQUESTED_AWS_REGION"
            echo "- Environment: staging"
            echo "- Stack: $STACK"
            echo "- Commit: $GITHUB_SHA"
            echo "- Cost: Terraform plan does not estimate AWS cost; inspect the current billing view and budget before any destroy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify private plan bucket controls
        run: bash scripts/validate_plan_bucket.sh

      - name: Require runner access before creating a platform destroy plan
        if: inputs.stack == 'platform' || inputs.stack == 'hml' || inputs.stack == 'production'
        run: |
          set +e
          bash scripts/eks-endpoint-access.sh runner-allowed
          runner_access_status=$?
          set -e
          if [[ "$runner_access_status" -eq 10 ]]; then
            echo "::error::The Actions runner is outside the EKS administrator allowlist; no platform destroy plan was saved."
            exit 1
          fi
          if [[ "$runner_access_status" -ne 0 ]]; then
            exit "$runner_access_status"
          fi

      - name: Create and store one exact private destroy plan
        env:
          STACK: ${{ inputs.stack }}
          SCOPE: ${{ inputs.scope }}
          SESSION_ID: ${{ inputs.session_id }}
          SESSION_STARTED_AT: ${{ inputs.started_at }}
          SESSION_MODE: ${{ inputs.session_mode }}
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          umask 077
          plan_dir="$(mktemp -d)"
          trap 'rm -rf -- "$plan_dir"' EXIT
          plan_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan_file="$plan_dir/$STACK.tfplan"
          plan_json="$plan_dir/plan.json"
          manifest_file="$plan_dir/manifest.json"

          if [[ "$STACK" == "foundation" || "$STACK" == "platform" ]]; then
            bash scripts/assert_roots_empty_before_destroy.sh "$STACK"
          fi

          terraform_root="$(python3 scripts/terraform_root.py "$STACK")"
          terraform -chdir="$terraform_root" init -input=false
          if [[ "$STACK" == "foundation" && "$SCOPE" == "compute" ]]; then
            terraform -chdir="$terraform_root" plan \
              -destroy \
              -target=module.eks \
              -target=module.alb \
              -input=false \
              -lock=false \
              -no-color \
              -out="$plan_file" >/dev/null
            guard_policy="compute-destroy"
          else
            terraform -chdir="$terraform_root" plan \
              -destroy \
              -input=false \
              -lock=false \
              -no-color \
              -out="$plan_file" >/dev/null
            guard_policy="all-destroy"
          fi
          terraform -chdir="$terraform_root" show -json "$plan_file" > "$plan_json"
          python3 scripts/terraform_plan_guard.py --plan-json "$plan_json" --policy "$guard_policy"
          ./scripts/plan-summary.sh "$plan_file" "$STACK" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/validate_staging_session.py \
            --session-id "$SESSION_ID" \
            --started-at "$SESSION_STARTED_AT" \
            --mode "$SESSION_MODE" \
            --operation teardown \
            --minimum-remaining-seconds 720

          python3 scripts/terraform_plan_artifact.py create-manifest \
            --plan-id "$plan_id" \
            --purpose destroy \
            --aws-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --aws-region "$REQUESTED_AWS_REGION" \
            --commit-sha "$GITHUB_SHA" \
            --session-id "$SESSION_ID" \
            --session-started-at "$SESSION_STARTED_AT" \
            --session-mode "$SESSION_MODE" \
            --scope "$SCOPE" \
            --terraform-version "$TF_VERSION" \
            --output "$manifest_file" \
            --plan "$STACK=$plan_file"

          attestation_dir="$RUNNER_TEMP/k8s-plan-attestation"
          mkdir -p "$attestation_dir"
          chmod 700 "$attestation_dir"
          python3 scripts/terraform_plan_artifact.py create-attestation \
            --manifest "$manifest_file" \
            --output "$attestation_dir/manifest.sha256"

          python3 scripts/validate_staging_session.py \
            --session-id "$SESSION_ID" \
            --started-at "$SESSION_STARTED_AT" \
            --mode "$SESSION_MODE" \
            --operation teardown \
            --minimum-remaining-seconds 720

          plan_base_key="$PLAN_PREFIX/$plan_id/destroy"
          aws s3api put-object \
            --bucket "$PLAN_BUCKET" \
            --key "$plan_base_key/manifest-$STACK.json" \
            --body "$manifest_file" \
            --region "$REQUESTED_AWS_REGION" \
            --server-side-encryption AES256 \
            --expected-bucket-owner "$EXPECTED_AWS_ACCOUNT_ID" \
            --no-cli-pager >/dev/null
          aws s3api put-object \
            --bucket "$PLAN_BUCKET" \
            --key "$plan_base_key/$STACK.tfplan" \
            --body "$plan_file" \
            --region "$REQUESTED_AWS_REGION" \
            --server-side-encryption AES256 \
            --expected-bucket-owner "$EXPECTED_AWS_ACCOUNT_ID" \
            --no-cli-pager >/dev/null

          {
            echo "### Destroy plan ready for review"
            echo "- Plan ID: $plan_id"
            echo "- Stack: $STACK"
            echo "- Scope: $SCOPE"
            echo "- Commit: $GITHUB_SHA"
            echo "- Private object prefix: s3://$PLAN_BUCKET/$plan_base_key/"
            echo "- Destroy platform first. Foundation scope=compute removes only module.eks and module.alb and preserves the VPC, subnets, and SSM contract."
            echo "- Review every resource/action and the current cost/budget before dispatching operation=destroy with confirm=destroy."
            echo "- A successful destroy removes the exact plan and manifest objects. Unconsumed plans remain private in S3 until lifecycle cleanup or an authorized cleanup."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store the exact manifest digest with the originating workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-plan-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k8s-plan-attestation/manifest.sha256
          if-no-files-found: error
          retention-days: 7

  destroy-apply:
    name: destroy reviewed saved plan
    if: github.ref == 'refs/heads/main' && inputs.operation == 'destroy'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 13
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require persistent private-runner configuration for foundation
        env:
          REQUESTED_STACK: ${{ inputs.stack }}
        run: python3 scripts/require_private_runner_configuration.py

      - name: Reject a reused lifecycle dispatch ID
        env:
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
          REQUESTED_SESSION_STARTED_AT: ${{ inputs.started_at }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/assert_unique_lifecycle_dispatch.py --workflow-file destroy.yml

      - id: validate-session
        name: Require the matching session, plan ID, and destruction confirmation
        env:
          REQUESTED_STACK: ${{ inputs.stack }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_PLAN_ID: ${{ inputs.plan_id }}
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_STARTED_AT: ${{ inputs.started_at }}
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
          REQUESTED_SESSION_MODE: ${{ inputs.session_mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_LIFECYCLE_DISPATCH_ID" && ! "$REQUESTED_LIFECYCLE_DISPATCH_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::The lifecycle dispatch ID must be 32 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Destroy requires main."
            exit 1
          fi
          case "$REQUESTED_STACK" in
            production)
              if [[ "$REQUESTED_SCOPE" != "all" ]]; then
                echo "::error::Environment and platform roots require scope=all."
                exit 1
              fi
              ;;
            foundation)
              if [[ "$REQUESTED_SCOPE" != "compute" ]]; then
                echo "::error::Foundation teardown must use scope=compute to preserve the VPC and SSM contract."
                exit 1
              fi
              ;;
            *) echo "::error::Unsupported Terraform stack."; exit 1 ;;
          esac
          if [[ "$REQUESTED_STACK" == "hml" && "$REQUESTED_SESSION_MODE" != "hml" ]]; then
            echo "::error::The HML root can only be torn down in an HML session."
            exit 1
          fi
          if [[ "$REQUESTED_STACK" == "production" && "$REQUESTED_SESSION_MODE" != "prd-window" ]]; then
            echo "::error::The production root can only be torn down in a PRD window."
            exit 1
          fi
          if [[ "$CONFIRM" != "destroy" ]]; then
            echo "::error::Type destroy only after reviewing the exact destroy plan and current cost/budget."
            exit 1
          fi
          if [[ ! "$REQUESTED_PLAN_ID" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "::error::The plan ID must be a GitHub run ID and attempt, formatted as digits-digits."
            exit 1
          fi
          case "$REQUESTED_STACK" in
            production|foundation) ;;
            *) echo "::error::Unsupported Terraform stack."; exit 1 ;;
          esac
          python3 scripts/validate_staging_session.py \
            --session-id "$REQUESTED_SESSION_ID" \
            --started-at "$REQUESTED_STARTED_AT" \
            --mode "$REQUESTED_SESSION_MODE" \
            --operation teardown \
            --minimum-remaining-seconds 900
          plan_run_id="${REQUESTED_PLAN_ID%%-*}"
          echo "plan_run_id=$plan_run_id" >> "$GITHUB_OUTPUT"

      - name: Verify the originating destroy-plan workflow run
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_plan_run.py --plan-id "$PLAN_ID" --purpose destroy --expected-commit-sha "$EXPECTED_COMMIT_SHA"

      - name: Download the exact saved-plan manifest attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-plan-attestation-${{ inputs.plan_id }}
          path: ${{ runner.temp }}/k8s-plan-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-session.outputs.plan_run_id }}

      - name: Validate AWS region before requesting credentials
        env:
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_AWS_REGION" != "us-east-1" ]]; then
            echo "::error::Staging destroy is restricted to us-east-1; received '$REQUESTED_AWS_REGION'."
            exit 1
          fi

      - name: Require a trusted lifecycle actor before AWS credentials
        env:
          LIFECYCLE_TRUSTED_OPERATORS: ${{ vars.LIFECYCLE_TRUSTED_OPERATORS || '' }}
        run: python3 scripts/require_trusted_lifecycle_operator.py

      - name: Assume the dedicated lifecycle authorization consumer role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.EXPECTED_AWS_ACCOUNT_ID }}:role/auto-shop/auto-shop-staging-github-lifecycle-consumer-k8s-destroy
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          role-session-name: lifecycle-consumer-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Consume the one-use destroy dispatch authorization
        env:
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_LIFECYCLE_DISPATCH_ID: ${{ inputs.lifecycle_dispatch_id }}
        run: |
          set -euo pipefail
          python3 scripts/consume_lifecycle_dispatch.py \
            --session-id "$REQUESTED_SESSION_ID" \
            --dispatch-id "$REQUESTED_LIFECYCLE_DISPATCH_ID" \
            --workflow "Destroy"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        name: Assume the namespace-scoped HML deploy role
        if: inputs.stack == 'hml'
        with:
          role-to-assume: ${{ vars.AWS_HML_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        name: Assume the shared staging deploy role
        if: inputs.stack != 'hml'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Verify AWS account and report destroy scope
        env:
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
          STACK: ${{ inputs.stack }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::Expected AWS account $EXPECTED_AWS_ACCOUNT_ID, received $account_id."
            exit 1
          fi
          {
            echo "### AWS destroy scope"
            echo "- Account: $account_id"
            echo "- Region: $REQUESTED_AWS_REGION"
            echo "- Environment: staging"
            echo "- Stack: $STACK"
            echo "- Plan ID: $PLAN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Cost: Terraform plan does not estimate AWS cost; confirmation was entered after checking the current budget and billing view."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify private plan bucket controls
        run: bash scripts/validate_plan_bucket.sh

      - name: Require the runner to be in the EKS administrator allowlist
        if: inputs.stack == 'platform' || inputs.stack == 'hml' || inputs.stack == 'production'
        run: |
          set +e
          bash scripts/eks-endpoint-access.sh runner-allowed
          runner_access_status=$?
          set -e
          if [[ "$runner_access_status" -eq 10 ]]; then
            echo "::error::The Actions runner is outside the EKS administrator allowlist; no platform destroy was started."
            exit 1
          fi
          if [[ "$runner_access_status" -ne 0 ]]; then
            exit "$runner_access_status"
          fi

      - name: Verify and destroy the exact saved plan
        env:
          STACK: ${{ inputs.stack }}
          SCOPE: ${{ inputs.scope }}
          PLAN_ID: ${{ inputs.plan_id }}
          SESSION_ID: ${{ inputs.session_id }}
          SESSION_STARTED_AT: ${{ inputs.started_at }}
          SESSION_MODE: ${{ inputs.session_mode }}
          REQUESTED_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          umask 077
          plan_dir="$(mktemp -d)"
          trap 'rm -rf -- "$plan_dir"' EXIT
          plan_file="$plan_dir/$STACK.tfplan"
          plan_json="$plan_dir/plan.json"
          manifest_file="$plan_dir/manifest.json"
          plan_key="$PLAN_PREFIX/$PLAN_ID/destroy/$STACK.tfplan"
          manifest_key="$PLAN_PREFIX/$PLAN_ID/destroy/manifest-$STACK.json"

          aws s3 cp "s3://$PLAN_BUCKET/$plan_key" "$plan_file" \
            --region "$REQUESTED_AWS_REGION" \
            --expected-bucket-owner "$EXPECTED_AWS_ACCOUNT_ID" \
            --only-show-errors
          aws s3 cp "s3://$PLAN_BUCKET/$manifest_key" "$manifest_file" \
            --region "$REQUESTED_AWS_REGION" \
            --expected-bucket-owner "$EXPECTED_AWS_ACCOUNT_ID" \
            --only-show-errors
          python3 scripts/terraform_plan_artifact.py verify-attestation \
            --manifest "$manifest_file" \
            --attestation "$RUNNER_TEMP/k8s-plan-attestation/manifest.sha256"
          python3 scripts/terraform_plan_artifact.py verify \
            --manifest "$manifest_file" \
            --plan-file "$plan_file" \
            --plan-id "$PLAN_ID" \
            --purpose destroy \
            --aws-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --aws-region "$REQUESTED_AWS_REGION" \
            --stack "$STACK" \
            --commit-sha "$GITHUB_SHA" \
            --session-id "$SESSION_ID" \
            --session-started-at "$SESSION_STARTED_AT" \
            --session-mode "$SESSION_MODE" \
            --scope "$SCOPE" \
            --terraform-version "$TF_VERSION"

          if [[ "$STACK" == "foundation" || "$STACK" == "platform" ]]; then
            bash scripts/assert_roots_empty_before_destroy.sh "$STACK"
          fi

          terraform_root="$(python3 scripts/terraform_root.py "$STACK")"
          terraform -chdir="$terraform_root" init -input=false
          terraform -chdir="$terraform_root" show -json "$plan_file" > "$plan_json"
          if [[ "$STACK" == "foundation" && "$SCOPE" == "compute" ]]; then
            guard_policy="compute-destroy"
          else
            guard_policy="all-destroy"
          fi
          python3 scripts/terraform_plan_guard.py --plan-json "$plan_json" --policy "$guard_policy"
          python3 scripts/validate_staging_session.py \
            --session-id "$SESSION_ID" \
            --started-at "$SESSION_STARTED_AT" \
            --mode "$SESSION_MODE" \
            --operation teardown \
            --minimum-remaining-seconds 720
          terraform -chdir="$terraform_root" apply \
            -input=false \
            -lock-timeout=300s \
            "$plan_file" >/dev/null
          echo "$STACK destroyed from saved plan $PLAN_ID." >> "$GITHUB_STEP_SUMMARY"
          bash scripts/delete-plan-artifact.sh "$PLAN_ID" destroy "$STACK"
