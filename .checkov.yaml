# Accepted trade-offs for the ephemeral staging environment (ADR-0071, revision 2026-10-25).
# Every skip below is documented in README.md > "Decisões de segurança aceitas".
framework:
  - terraform
skip-check:
  - CKV_AWS_2     # Internal ALB listens on HTTP: reachable only inside the VPC via VPC Link; TLS terminates at API Gateway
  - CKV_AWS_103   # Same as above (no TLS listener on the internal ALB)
  - CKV_AWS_378   # Same as above
  - CKV2_AWS_20   # Same as above (no HTTP->HTTPS redirect on an internal listener)
  - CKV_AWS_91    # ALB access logs disabled to avoid S3/log cost; API Gateway access logs cover the public edge
  - CKV_AWS_150   # Deletion protection off: session-down must destroy the ALB the same day
  - CKV2_AWS_34   # SSM contract holds only non-secret IDs/URLs by design; secrets live in Secrets Manager
  - CKV2_AWS_5    # Lambda security group is attached by the lambda-auth repository
  - CKV_TF_1      # Registry modules are pinned to exact versions plus .terraform.lock.hcl
  # aws_iam_policy_document.project_boundary intentionally mirrors AWS's own PowerUserAccess shape
  # (NotAction: [iam:*, organizations:*, account:*], Resource: "*"). It is a permissions *boundary*,
  # never attached as a standalone identity policy: every role created under /auto-shop/ must carry
  # it, which caps that role's effective permissions to its intersection with whatever identity
  # policy is attached — the actual grant, scoped separately (deploy_iam, plan_restrictions). These
  # six checks evaluate the document as if it alone granted access and flag the same shape AWS uses
  # for its own broad managed policies.
  - CKV_AWS_107
  - CKV_AWS_108
  - CKV_AWS_109
  - CKV_AWS_110
  - CKV_AWS_111
  - CKV_AWS_356
